<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Which Bin?</title>
<meta name="theme-color" content="#0f1117" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* tokens */
:root{
  --bg:#0f1117; --surface:#181c27; --surface2:#1e2335; --border:#2a2f45;
  --ink:#e8eaf0; --muted:#7b82a0; --faint:#2e3448;
  --recycle:#3b82f6; --recycle-glow:rgba(59,130,246,.35);
  --compost:#a16207;  --compost-glow:rgba(161,98,7,.35);
  --hazardous:#ef4444;--hazardous-glow:rgba(239,68,68,.35);
  --landfill:#64748b; --landfill-glow:rgba(100,116,139,.35);
  --accent:var(--recycle); --glow:var(--recycle-glow);
  --sans:"Inter",system-ui,sans-serif;
  --display:"Syne","Inter",system-ui,sans-serif;
  --radius:18px; --radius-sm:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  -webkit-font-smoothing:antialiased; line-height:1.55;
  padding:env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
}

/* layout */
.wrap{
  max-width:480px; margin:0 auto; min-height:100svh;
  display:flex; flex-direction:column; padding:20px 20px 32px;
}

/* header */
header{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px}
.brand{display:flex; align-items:center; gap:10px}
.logo-ring{
  width:38px; height:38px; border-radius:50%;
  background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#fff));
  display:grid; place-items:center; flex-shrink:0;
  box-shadow:0 0 16px var(--glow);
  transition:box-shadow .4s ease, background .4s ease;
}
.logo-ring svg{width:20px; height:20px; color:#fff}
.wordmark{font-family:var(--display); font-weight:800; font-size:22px; letter-spacing:-.025em}
.wordmark span{color:var(--accent); transition:color .4s ease}
.lang{
  font-family:var(--sans); font-size:13px; font-weight:500; color:var(--ink);
  background:var(--surface); border:1px solid var(--border); border-radius:10px;
  padding:7px 10px; cursor:pointer; transition:border-color .2s;
}
.lang:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.lang:hover{border-color:var(--accent)}

/* main */
main{flex:1; display:flex; flex-direction:column; gap:14px; padding:10px 0}

/* upload stage */
.stage{
  position:relative; border:2px dashed var(--border); border-radius:var(--radius);
  background:var(--surface); aspect-ratio:4/5; display:flex;
  flex-direction:column; align-items:center; justify-content:center;
  text-align:center; gap:16px; overflow:hidden; cursor:pointer;
  transition:border-color .25s, background .25s;
}
.stage:hover{border-color:var(--accent); background:color-mix(in srgb,var(--surface) 94%,var(--accent))}
.stage.has-img{border-style:solid; background:#000; cursor:default}
.stage.has-img:hover{background:#000; border-color:var(--accent)}
.stage img{position:absolute; inset:0; width:100%; height:100%; object-fit:contain}

.upload-hint{display:flex; flex-direction:column; align-items:center; gap:14px; padding:0 24px}
.cam-icon{
  width:68px; height:68px; border-radius:50%;
  background:linear-gradient(135deg,var(--faint),var(--surface2));
  border:1px solid var(--border); display:grid; place-items:center;
}
.cam-icon svg{width:30px; height:30px; color:var(--accent)}
.upload-hint p{color:var(--muted); font-size:14px; max-width:20ch; line-height:1.5}

/* result overlay */
.result{
  position:absolute; inset:0;
  background:linear-gradient(160deg,
    color-mix(in srgb,var(--accent) 85%,#000) 0%,
    color-mix(in srgb,var(--accent) 60%,#000) 100%);
  color:#fff; display:flex; flex-direction:column;
  align-items:center; justify-content:center; text-align:center;
  gap:4px; padding:28px;
  transition:background .5s ease;
}
.result[hidden]{display:none}
.r-emoji{font-size:64px; line-height:1; filter:drop-shadow(0 4px 12px rgba(0,0,0,.4))}
.r-class{
  font-family:var(--display); font-weight:800; font-size:40px;
  letter-spacing:-.03em; text-transform:capitalize; margin:4px 0 2px;
  text-shadow:0 2px 16px rgba(0,0,0,.35);
}
.r-bin{font-weight:600; font-size:16px; opacity:.95}
.r-conf{font-size:12px; opacity:.75; margin-top:2px}
.r-haz{
  margin-top:12px; font-weight:700; font-size:12px; letter-spacing:.04em;
  background:rgba(0,0,0,.3); padding:6px 14px; border-radius:999px;
  text-transform:uppercase; border:1px solid rgba(255,255,255,.25);
}

/* top-3 bar */
.top3-bar{
  position:absolute; bottom:0; left:0; right:0;
  background:rgba(0,0,0,.55); backdrop-filter:blur(8px);
  padding:10px 14px 12px; display:flex; gap:8px; justify-content:center;
}
.top3-bar[hidden]{display:none}
.t3item{display:flex; flex-direction:column; align-items:center; gap:2px; flex:1; max-width:90px}
.t3label{font-size:10.5px; font-weight:600; opacity:.85; text-transform:capitalize; letter-spacing:.01em}
.t3track{width:100%; height:4px; background:rgba(255,255,255,.18); border-radius:999px; overflow:hidden}
.t3fill{height:100%; border-radius:999px; background:rgba(255,255,255,.85); transition:width .6s cubic-bezier(.4,0,.2,1)}
.t3pct{font-size:9.5px; opacity:.65}

/* chat */
.chat{display:flex; flex-direction:column; gap:10px}
.chat[hidden]{display:none}
.thread{display:flex; flex-direction:column; gap:10px}
.msg{
  max-width:88%; padding:11px 14px; border-radius:16px;
  font-size:14.5px; white-space:pre-wrap; word-wrap:break-word; line-height:1.55;
}
.msg.bot{
  align-self:flex-start; background:var(--surface2); border:1px solid var(--border);
  border-bottom-left-radius:5px;
}
.msg.me{
  align-self:flex-end; color:#fff; border-bottom-right-radius:5px;
  background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 70%,#fff));
}

.botrow{display:flex; flex-direction:column; align-items:flex-start; gap:5px; max-width:88%}
.bot-meta{display:flex; align-items:center; gap:8px}
.speak{
  display:inline-flex; align-items:center; gap:5px; background:none; border:none;
  cursor:pointer; color:var(--accent); font-weight:600; font-size:11.5px; padding:2px 0;
}
.speak svg{width:14px; height:14px}
.speak:disabled{opacity:.45}
.provider-tag{
  font-size:10px; font-weight:600; letter-spacing:.05em; text-transform:uppercase;
  color:var(--muted); background:var(--faint); border-radius:5px; padding:2px 6px;
}

.thinking{
  display:inline-flex; gap:5px; align-items:center; color:var(--muted); font-size:14px;
  padding:4px 0;
}
.dot{
  width:7px; height:7px; border-radius:50%; background:var(--accent);
  animation:pulse 1.1s infinite ease-in-out;
}
.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,100%{opacity:.2;transform:scale(.9)}50%{opacity:1;transform:scale(1)}}

.composer{display:flex; gap:8px; align-items:flex-end}
.composer input{
  flex:1; font-family:var(--sans); font-size:14.5px;
  border:1px solid var(--border); background:var(--surface2); border-radius:var(--radius-sm);
  padding:12px 14px; color:var(--ink); transition:border-color .2s;
}
.composer input::placeholder{color:var(--muted)}
.composer input:focus-visible{outline:none; border-color:var(--accent)}
.send{
  background:var(--accent); color:#fff; border:none; border-radius:var(--radius-sm);
  padding:12px 18px; font-weight:600; font-size:14px; cursor:pointer;
  transition:opacity .15s, transform .1s;
  box-shadow:0 4px 16px var(--glow);
}
.send:hover{opacity:.88}
.send:active{transform:scale(.96)}

/* action buttons */
.actions{display:flex; flex-direction:column; gap:9px}
.btn{
  font-family:var(--sans); font-weight:600; font-size:15px; border:none;
  border-radius:var(--radius-sm); padding:15px 18px; cursor:pointer;
  transition:transform .08s ease, opacity .15s; display:flex;
  align-items:center; justify-content:center; gap:8px;
}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.btn[disabled]{opacity:.45; cursor:default}
.btn-primary{
  background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 70%,#fff));
  color:#fff; box-shadow:0 4px 20px var(--glow);
}
.btn-primary:hover:not([disabled]){opacity:.9}
.btn-ghost{
  background:var(--surface); color:var(--ink);
  border:1px solid var(--border);
}
.btn-ghost:hover{border-color:var(--accent); color:var(--accent)}

/* status */
.status{min-height:18px; font-size:12.5px; color:var(--hazardous); text-align:center; letter-spacing:.01em}

/* footer */
footer{
  color:var(--muted); font-size:11px; text-align:center;
  margin-top:16px; line-height:1.6; padding:0 4px;
}

/* misc */
input[type=file]{display:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="logo-ring" id="logoRing">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"/>
          <path d="M3.51 15a9 9 0 1 0 .49-4.95"/>
        </svg>
      </div>
      <span class="wordmark">Which <span id="binWord">bin?</span></span>
    </div>
    <select class="lang" id="lang" aria-label="Language for answers and voice">
      <option value="en-IN">English</option>
      <option value="hi-IN">हिन्दी</option>
      <option value="ta-IN">தமிழ்</option>
      <option value="te-IN">తెలుగు</option>
      <option value="kn-IN">ಕನ್ನಡ</option>
      <option value="ml-IN">മലയാളം</option>
      <option value="mr-IN">मराठी</option>
      <option value="gu-IN">ગુજરાતી</option>
      <option value="bn-IN">বাংলা</option>
      <option value="pa-IN">ਪੰਜਾਬੀ</option>
      <option value="od-IN">ଓଡ਼ਿਆ</option>
    </select>
  </header>

  <main>
    <div class="stage" id="stage" role="button" tabindex="0" aria-label="Tap to take or upload a photo">
      <div class="upload-hint" id="uploadHint">
        <div class="cam-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.5 4h-5L8 6H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-4l-1.5-2z"/>
            <circle cx="12" cy="13" r="3.5"/>
          </svg>
        </div>
        <p>Snap a photo of any item and we'll tell you exactly where it goes.</p>
      </div>

      <img id="preview" alt="" hidden />

      <div class="result" id="result" hidden>
        <div class="r-emoji" id="rEmoji"></div>
        <div class="r-class" id="rClass"></div>
        <div class="r-bin"   id="rBin"></div>
        <div class="r-conf"  id="rConf"></div>
        <div class="r-haz"   id="rHaz" hidden>Handle with care</div>
      </div>

      <div class="top3-bar" id="top3Bar" hidden></div>
    </div>

    <section class="chat" id="chat" hidden>
      <div class="thread" id="thread"></div>
      <div class="composer">
        <input id="q" type="text" placeholder="Ask anything about this item..." autocomplete="off" />
        <button class="send btn" id="sendBtn" aria-label="Send">Send</button>
      </div>
    </section>

    <div class="actions">
      <button class="btn btn-primary" id="shoot">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.5 4h-5L8 6H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-4l-1.5-2z"/>
          <circle cx="12" cy="13" r="3.5"/>
        </svg>
        Take a photo
      </button>
      <button class="btn btn-primary" id="identify" hidden>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        Identify waste
      </button>
      <button class="btn btn-ghost" id="again" hidden>Scan another item</button>
    </div>

    <div class="status" id="status" role="status" aria-live="polite"></div>
  </main>

  <footer>
    EfficientNetV2 vision model (93.6% val acc) &middot;
    chat by Gemini / Groq &middot; voice by Sarvam AI<br>
    A guide, not a guarantee &mdash; always check local rules for hazardous items.
  </footer>
</div>

<input type="file" id="file" accept="image/*" capture="environment" />
<audio id="player" hidden></audio>

<script>
const $ = id => document.getElementById(id);
const cssVar = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

const BINS = {
  recycle:   {color:'--recycle',  glow:'--recycle-glow',  label:'Goes in the recycling bin'},
  compost:   {color:'--compost',  glow:'--compost-glow',  label:'Goes in compost / wet waste'},
  hazardous: {color:'--hazardous',glow:'--hazardous-glow',label:'Hazardous \u2014 special drop-off required'},
  landfill:  {color:'--landfill', glow:'--landfill-glow', label:'Goes in general waste'},
};

const SPEAKER_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>`;

let currentImage = null;
let item = null;
let history = [];

$('shoot').onclick    = () => $('file').click();
$('stage').onkeydown  = e => { if (e.key === 'Enter' || e.key === ' ') $('file').click(); };
$('stage').onclick    = () => { if (!item && !currentImage) $('file').click(); };
$('again').onclick    = reset;
$('identify').onclick = identify;
$('file').onchange    = e => { const f = e.target.files[0]; if (f) loadImage(f); e.target.value = ''; };
$('sendBtn').onclick  = send;
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

function loadImage(file) {
  const img = new Image();
  img.onload = () => {
    const max = 640, s = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    currentImage = c.toDataURL('image/jpeg', 0.88);
    $('preview').src = currentImage; $('preview').hidden = false;
    $('stage').classList.add('has-img');
    $('uploadHint').hidden = true;
    $('result').hidden = true; $('top3Bar').hidden = true;
    $('chat').hidden = true;
    $('shoot').hidden = true; $('identify').hidden = false; $('again').hidden = false;
    setStatus('');
  };
  img.src = URL.createObjectURL(file);
}

async function identify() {
  if (!currentImage) return;
  $('identify').disabled = true;
  $('identify').innerHTML = `<span class="thinking"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span> Analysing\u2026`;
  setStatus('');
  try {
    const r = await post('/api/classify', { image: currentImage });
    if (r.error) throw new Error(r.error);
    item = r; showResult(r);
  } catch (err) {
    setStatus('Could not identify that \u2014 try a clearer, closer photo.');
    console.error(err);
  } finally {
    $('identify').disabled = false;
    $('identify').innerHTML = `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg> Identify waste`;
    $('identify').hidden = true;
  }
}

function setAccent(binType) {
  const b = BINS[binType] || BINS.landfill;
  const color = cssVar(b.color);
  const glow  = cssVar(b.glow);
  document.documentElement.style.setProperty('--accent', color);
  document.documentElement.style.setProperty('--glow',   glow);
  $('logoRing').style.boxShadow = `0 0 20px ${glow}`;
}

function showResult(r) {
  const bin = BINS[r.bin.type] || BINS.landfill;
  setAccent(r.bin.type);
  $('rEmoji').textContent = r.bin.emoji;
  $('rClass').textContent = r.class;
  $('rBin').textContent   = bin.label;
  $('rConf').textContent  = `${Math.round(r.confidence * 100)}% confident`;
  $('rHaz').hidden = !r.hazardous;
  $('result').hidden = false;

  if (r.top3 && r.top3.length) {
    const bar = $('top3Bar');
    bar.innerHTML = r.top3.map(t => `
      <div class="t3item">
        <div class="t3label">${t.class}</div>
        <div class="t3track"><div class="t3fill" style="width:${Math.round(t.confidence*100)}%"></div></div>
        <div class="t3pct">${Math.round(t.confidence*100)}%</div>
      </div>`).join('');
    bar.hidden = false;
  }

  history = [];
  $('thread').innerHTML = '';
  $('chat').hidden = false;
  openingMessage();
}

async function openingMessage() {
  const row = addBotRow(); setThinking(row);
  try {
    const r = await post('/api/chat', {
      label: item.class, bin: item.bin.type, confidence: item.confidence,
      lang: $('lang').value, messages: []
    });
    if (r.error || !r.text) throw new Error(r.error || 'no text');
    fillBot(row, r.text, r.provider);
    history.push({ role: 'assistant', content: r.text });
  } catch (err) {
    const fallback = `${item.class.charAt(0).toUpperCase() + item.class.slice(1)}: ${item.instructions} Watch out \u2014 ${item.common_mistake}`;
    fillBot(row, fallback, 'offline');
    history.push({ role: 'assistant', content: fallback });
    console.warn('Chat fallback:', err);
  }
}

async function send() {
  const text = $('q').value.trim();
  if (!text || !item) return;
  $('q').value = '';
  addMe(text);
  history.push({ role: 'user', content: text });
  const row = addBotRow(); setThinking(row);
  try {
    const r = await post('/api/chat', {
      label: item.class, bin: item.bin.type, confidence: item.confidence,
      lang: $('lang').value, messages: history
    });
    if (r.error || !r.text) throw new Error(r.error || 'no text');
    fillBot(row, r.text, r.provider);
    history.push({ role: 'assistant', content: r.text });
  } catch (err) {
    fillBot(row, 'Sorry, I could not answer that just now. Please try again.', null);
    console.error(err);
  }
}

function addMe(text) {
  const d = document.createElement('div');
  d.className = 'msg me'; d.textContent = text;
  $('thread').appendChild(d); scroll();
}

function addBotRow() {
  const row = document.createElement('div');
  row.className = 'botrow';
  $('thread').appendChild(row); scroll(); return row;
}

function setThinking(row) {
  row.innerHTML = `<div class="msg bot"><span class="thinking"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span></div>`;
  scroll();
}

const PROVIDER_LABELS = { gemini: '\u2726 Gemini', groq: '\u26A1 Groq', fallback: 'offline', offline: 'offline' };

function fillBot(row, text, provider) {
  row.innerHTML = '';
  const bubble = document.createElement('div');
  bubble.className = 'msg bot'; bubble.textContent = text;
  row.appendChild(bubble);

  const meta = document.createElement('div');
  meta.className = 'bot-meta';

  const btn = document.createElement('button');
  btn.className = 'speak'; btn.innerHTML = SPEAKER_SVG + '<span>Listen</span>';
  btn.onclick = () => speak(text, btn);
  meta.appendChild(btn);

  if (provider && PROVIDER_LABELS[provider]) {
    const tag = document.createElement('span');
    tag.className = 'provider-tag'; tag.textContent = PROVIDER_LABELS[provider];
    meta.appendChild(tag);
  }

  row.appendChild(meta); scroll();
}

function scroll() { $('thread').lastElementChild?.scrollIntoView({ block: 'nearest' }); }

async function speak(text, btn) {
  btn.disabled = true;
  try {
    const r = await post('/api/tts', { text, language_code: $('lang').value });
    if (r.error || !r.audio) throw new Error(r.error || 'no audio');
    const p = $('player');
    p.src = `data:${r.mime || 'audio/mpeg'};base64,${r.audio}`;
    await p.play();
  } catch (err) {
    setStatus('Voice unavailable right now.'); console.error(err);
  } finally { btn.disabled = false; }
}

function reset() {
  currentImage = null; item = null; history = [];
  $('preview').hidden = true; $('preview').src = '';
  $('stage').classList.remove('has-img');
  $('result').hidden = true; $('top3Bar').hidden = true;
  $('chat').hidden = true; $('thread').innerHTML = '';
  $('uploadHint').hidden = false;
  $('identify').hidden = true; $('again').hidden = true; $('shoot').hidden = false;
  setStatus('');
  document.documentElement.style.removeProperty('--accent');
  document.documentElement.style.removeProperty('--glow');
  $('logoRing').style.removeProperty('box-shadow');
}

function setStatus(t) { $('status').textContent = t; }

async function post(url, body) {
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  return res.json();
}
