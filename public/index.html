<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Which Bin?</title>
<meta name="theme-color" content="#FBFAF6" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --paper:#FBFAF6; --ink:#141A16; --muted:#5B6A60; --line:#E4E0D6; --field:#F2EFE7;
    --recycle:#1668E0; --compost:#876B3C; --hazardous:#CE3A2E; --landfill:#59636E;
    --accent:var(--recycle);
    --sans:"Inter",system-ui,sans-serif;
    --display:"Bricolage Grotesque","Inter",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--paper); color:var(--ink); font-family:var(--sans);
    -webkit-font-smoothing:antialiased; line-height:1.5;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap{max-width:460px; margin:0 auto; min-height:100svh; display:flex; flex-direction:column; padding:20px 20px 26px}
  header{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:4px}
  .brand{display:flex; align-items:baseline; gap:9px}
  .mark{font-family:var(--display); font-weight:800; font-size:25px; letter-spacing:-.02em}
  .mark b{color:var(--accent)}
  .sub{color:var(--muted); font-size:13px}
  .lang{font-family:var(--sans); font-size:13px; font-weight:500; color:var(--ink);
    background:var(--field); border:1px solid var(--line); border-radius:10px; padding:8px 10px}
  .lang:focus-visible{outline:3px solid var(--accent); outline-offset:2px}

  main{flex:1; display:flex; flex-direction:column; gap:16px; padding:12px 0}

  .stage{position:relative; border:2px dashed var(--line); border-radius:22px; background:var(--field);
    aspect-ratio:4/5; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:14px; overflow:hidden}
  .stage.has-img{border-style:solid; background:#000}
  .stage img{position:absolute; inset:0; width:100%; height:100%; object-fit:contain}
  .lens{width:56px; height:56px; border-radius:50%; background:var(--ink); color:var(--paper); display:grid; place-items:center}
  .lens svg{width:27px; height:27px}
  .stage p{margin:0; color:var(--muted); font-size:15px; max-width:22ch}

  .result{position:absolute; inset:0; background:var(--accent); color:#fff; display:flex;
    flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:5px; padding:22px}
  .result[hidden]{display:none}
  .emoji{font-size:60px; line-height:1}
  .cls{font-family:var(--display); font-weight:800; font-size:38px; letter-spacing:-.02em; text-transform:capitalize; margin:2px 0}
  .binline{font-weight:600; font-size:16.5px; opacity:.96}
  .conf{font-size:12.5px; opacity:.82}
  .haz{margin-top:9px; font-weight:600; font-size:12.5px; background:rgba(0,0,0,.22); padding:6px 12px; border-radius:999px}

  /* chat */
  .chat{display:flex; flex-direction:column; gap:10px}
  .chat[hidden]{display:none}
  .thread{display:flex; flex-direction:column; gap:10px}
  .msg{max-width:88%; padding:11px 14px; border-radius:16px; font-size:15px; white-space:pre-wrap; word-wrap:break-word}
  .msg.bot{align-self:flex-start; background:var(--field); border:1px solid var(--line); border-bottom-left-radius:6px}
  .msg.me{align-self:flex-end; background:var(--ink); color:var(--paper); border-bottom-right-radius:6px}
  .botrow{display:flex; flex-direction:column; align-items:flex-start; gap:4px; max-width:88%}
  .speak{display:inline-flex; align-items:center; gap:6px; background:none; border:none; cursor:pointer;
    color:var(--accent); font-weight:600; font-size:12.5px; padding:2px 2px}
  .speak svg{width:15px; height:15px}
  .speak:disabled{opacity:.5}
  .thinking{display:inline-flex; gap:6px; align-items:center; color:var(--muted); font-size:14px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite ease-in-out}
  @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}

  .composer{display:flex; gap:8px}
  .composer input{flex:1; font-family:var(--sans); font-size:15px; border:1px solid var(--line);
    background:#fff; border-radius:13px; padding:13px 14px; color:var(--ink)}
  .composer input:focus-visible{outline:3px solid var(--accent); outline-offset:1px}
  .send{background:var(--accent); color:#fff; border:none; border-radius:13px; padding:0 16px; font-weight:600; cursor:pointer}

  .actions{display:flex; flex-direction:column; gap:10px}
  button.big{font-family:var(--sans); font-weight:600; font-size:16px; border:none; border-radius:14px; padding:15px 18px; cursor:pointer; transition:transform .08s ease}
  button.big:active{transform:scale(.98)}
  button:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
  button[disabled]{opacity:.5; cursor:default}
  .primary{background:var(--ink); color:var(--paper)}
  .ghost{background:transparent; color:var(--ink); border:1.5px solid var(--line)}

  .status{min-height:18px; font-size:13px; color:var(--hazardous); text-align:center}
  footer{color:var(--muted); font-size:11.5px; text-align:center; margin-top:14px}
  input[type=file]{display:none}
  @media (prefers-reduced-motion:reduce){ *{animation:none!important; transition:none!important} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <span class="mark">Which <b>bin?</b></span>
    </div>
    <select class="lang" id="lang" aria-label="Language for answers and voice">
      <option value="en-IN">English</option>
      <option value="hi-IN">हिन्दी</option>
      <option value="ta-IN">தமிழ்</option>
      <option value="te-IN">తెలుగు</option>
      <option value="kn-IN">ಕನ್ನಡ</option>
      <option value="ml-IN">മലയാളം</option>
      <option value="mr-IN">मराठी</option>
      <option value="gu-IN">ગુજરાતી</option>
      <option value="bn-IN">বাংলা</option>
      <option value="pa-IN">ਪੰਜਾਬੀ</option>
      <option value="od-IN">ଓଡ଼ିଆ</option>
    </select>
  </header>

  <main>
    <div class="stage" id="stage">
      <div class="lens" id="lensHint" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L8 6H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-4l-1.5-2z"/><circle cx="12" cy="13" r="3.5"/></svg>
      </div>
      <p id="hint">Snap a photo of the item and we'll tell you where it goes.</p>
      <img id="preview" alt="" hidden />
      <div class="result" id="result" hidden>
        <div class="emoji" id="rEmoji"></div>
        <div class="cls" id="rClass"></div>
        <div class="binline" id="rBin"></div>
        <div class="conf" id="rConf"></div>
        <div class="haz" id="rHaz" hidden>Handle with care</div>
      </div>
    </div>

    <section class="chat" id="chat" hidden>
      <div class="thread" id="thread"></div>
      <div class="composer">
        <input id="q" type="text" placeholder="Ask about this item…" autocomplete="off" />
        <button class="send" id="sendBtn" aria-label="Send">Send</button>
      </div>
    </section>

    <div class="actions">
      <button class="big primary" id="shoot">Take a photo</button>
      <button class="big primary" id="identify" hidden>Identify waste</button>
      <button class="big ghost" id="again" hidden>Scan another</button>
    </div>

    <div class="status" id="status" role="status" aria-live="polite"></div>
  </main>

  <footer>EfficientNetV2 vision model (93.6% val accuracy) · answers &amp; voice by Groq + Sarvam. A guide, not a guarantee — check local rules for hazardous items.</footer>
</div>

<input type="file" id="file" accept="image/*" capture="environment" />
<audio id="player" hidden></audio>

<script>
const $ = id => document.getElementById(id);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const BINS = {
  recycle:  {color:css('--recycle'),  label:'Goes in recycling'},
  compost:  {color:css('--compost'),  label:'Goes in compost / wet waste'},
  hazardous:{color:css('--hazardous'),label:'Hazardous — special drop-off'},
  landfill: {color:css('--landfill'), label:'Goes in general waste'},
};
const SPEAKER_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>';

let currentImage = null;   // downscaled dataURL
let item = null;           // {class, bin, confidence, instructions, common_mistake}
let history = [];          // [{role, content}] for Groq context

$('shoot').onclick = () => $('file').click();
$('again').onclick = reset;
$('identify').onclick = identify;
$('file').onchange = e => { const f = e.target.files[0]; if (f) loadImage(f); };
$('sendBtn').onclick = send;
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

function loadImage(file){
  const img = new Image();
  img.onload = () => {
    const max = 512, scale = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width*scale); c.height = Math.round(img.height*scale);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    currentImage = c.toDataURL('image/jpeg', 0.85);
    $('preview').src = currentImage; $('preview').hidden = false;
    $('stage').classList.add('has-img');
    $('lensHint').hidden = true; $('hint').hidden = true;
    $('result').hidden = true; $('chat').hidden = true;
    $('shoot').hidden = true; $('identify').hidden = false; $('again').hidden = false;
    setStatus('');
  };
  img.src = URL.createObjectURL(file);
}

async function identify(){
  if(!currentImage) return;
  $('identify').disabled = true; $('identify').textContent = 'Looking…'; setStatus('');
  try{
    const r = await post('/api/classify', {image: currentImage});
    if(r.error) throw new Error(r.error);
    item = r; showResult(r);
  }catch(err){
    setStatus('Could not identify that. Try a clearer, closer photo.'); console.error(err);
  }finally{
    $('identify').disabled = false; $('identify').textContent = 'Identify waste'; $('identify').hidden = true;
  }
}

function showResult(r){
  const bin = BINS[r.bin.type] || BINS.landfill;
  document.documentElement.style.setProperty('--accent', bin.color);
  $('rEmoji').textContent = r.bin.emoji;
  $('rClass').textContent = r.class;
  $('rBin').textContent = bin.label;
  $('rConf').textContent = `${Math.round(r.confidence*100)}% sure`;
  $('rHaz').hidden = !r.hazardous;
  $('result').hidden = false;

  history = [];
  $('thread').innerHTML = '';
  $('chat').hidden = false;
  openingMessage();            // Groq's opening guidance in the chosen language
}

// First assistant message: ask Groq for a summary (built-in tip shows if Groq is off).
async function openingMessage(){
  const row = addBotRow();
  setThinking(row);
  try{
    const r = await post('/api/chat', {
      label:item.class, bin:item.bin.type, confidence:item.confidence,
      lang:$('lang').value, messages:[]
    });
    if(r.error || !r.text) throw new Error(r.error || 'no text');
    fillBot(row, r.text); history.push({role:'assistant', content:r.text});
  }catch(err){
    // Groq unavailable -> fall back to the model's built-in English instruction.
    const fallback = `This is ${item.class}. ${item.instructions} Watch out: ${item.common_mistake}`;
    fillBot(row, fallback); history.push({role:'assistant', content:fallback});
    console.error(err);
  }
}

async function send(){
  const text = $('q').value.trim();
  if(!text || !item) return;
  $('q').value = '';
  addMe(text); history.push({role:'user', content:text});
  const row = addBotRow(); setThinking(row);
  try{
    const r = await post('/api/chat', {
      label:item.class, bin:item.bin.type, confidence:item.confidence,
      lang:$('lang').value, messages:history
    });
    if(r.error || !r.text) throw new Error(r.error || 'no text');
    fillBot(row, r.text); history.push({role:'assistant', content:r.text});
  }catch(err){
    fillBot(row, 'Sorry, I could not answer that just now. Please try again.');
    console.error(err);
  }
}

/* ---- chat rendering ---- */
function addMe(text){
  const d = document.createElement('div');
  d.className = 'msg me'; d.textContent = text;
  $('thread').appendChild(d); scroll();
}
function addBotRow(){
  const row = document.createElement('div'); row.className = 'botrow';
  $('thread').appendChild(row); scroll(); return row;
}
function setThinking(row){
  row.innerHTML = '<div class="msg bot"><span class="thinking"><span class="dot"></span>Thinking…</span></div>';
  scroll();
}
function fillBot(row, text){
  row.innerHTML = '';
  const bubble = document.createElement('div'); bubble.className = 'msg bot'; bubble.textContent = text;
  const btn = document.createElement('button');
  btn.className = 'speak'; btn.innerHTML = SPEAKER_SVG + '<span>Listen</span>';
  btn.onclick = () => speak(text, btn);
  row.appendChild(bubble); row.appendChild(btn); scroll();
}
function scroll(){ $('thread').lastElementChild?.scrollIntoView({block:'nearest'}); }

/* ---- Sarvam voice in the chosen language ---- */
async function speak(text, btn){
  btn.disabled = true;
  try{
    const r = await post('/api/tts', {text, language_code:$('lang').value});
    if(r.error || !r.audio) throw new Error(r.error || 'no audio');
    const p = $('player'); p.src = `data:${r.mime||'audio/mpeg'};base64,${r.audio}`;
    await p.play();
  }catch(err){
    setStatus('Voice is unavailable right now.'); console.error(err);
  }finally{ btn.disabled = false; }
}

function reset(){
  currentImage = null; item = null; history = [];
  $('preview').hidden = true; $('preview').src = '';
  $('stage').classList.remove('has-img');
  $('result').hidden = true; $('chat').hidden = true; $('thread').innerHTML = '';
  $('lensHint').hidden = false; $('hint').hidden = false;
  $('identify').hidden = true; $('again').hidden = true; $('shoot').hidden = false;
  setStatus('');
  document.documentElement.style.setProperty('--accent', css('--recycle'));
}

function setStatus(t){ $('status').textContent = t; }
async function post(url, body){
  const res = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  return res.json();
}
</script>
</body>
</html>
